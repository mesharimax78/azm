name: iOS → TestFlight
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: ios, cancel-in-progress: true }
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple secrets
        id: chk
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$TEAM_ID" ]; then
            echo "Apple secrets not set yet — skipping iOS build."; echo "ok=false" >> $GITHUB_OUTPUT
          else echo "ok=true" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Prepare web assets
        run: |
          mkdir -p app/www
          cp -r index.html cal.html manifest.webmanifest img icons videos app/www/
      - name: Create iOS project
        working-directory: app
        run: |
          npm install
          npx cap add ios
          npx cap sync ios
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $P
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName عزم" $P || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string عزم" $P
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string ar" $P || /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion ar" $P
          ICON=$(ls ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png | head -1)
          cp icon-1024.png "$ICON"
      - name: Build and upload to TestFlight
        if: steps.chk.outputs.ok == 'true'
        working-directory: app
        run: |
          KEY=$RUNNER_TEMP/AuthKey.p8
          printf '%s' "$ASC_KEY_P8" | (base64 --decode 2>/dev/null > $KEY || true)
          grep -q "BEGIN PRIVATE KEY" $KEY || printf '%s' "$ASC_KEY_P8" > $KEY
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          if [ -d ios/App/App.xcworkspace ]; then SRC="-workspace ios/App/App.xcworkspace"; else SRC="-project ios/App/App.xcodeproj"; fi
          BUILD=$(( ${{ github.run_number }} + 100 ))
          xcodebuild $SRC -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive archive $AUTH \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=$TEAM_ID PRODUCT_BUNDLE_IDENTIFIER=com.mesharimax78.azm \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=$BUILD | xcpretty || exit ${PIPESTATUS[0]}
          sed "s/__TEAM__/$TEAM_ID/" ExportOptions.plist > $RUNNER_TEMP/ExportOptions.plist
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/out $AUTH
          echo "Uploaded build $BUILD to App Store Connect → TestFlight"
      - name: Test build (no Apple account yet)
        if: steps.chk.outputs.ok != 'true'
        working-directory: app
        run: |
          if [ -d ios/App/App.xcworkspace ]; then SRC="-workspace ios/App/App.xcworkspace"; else SRC="-project ios/App/App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO | tail -5
